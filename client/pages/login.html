<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>התחברות | תורה האב</title>
    <link rel="stylesheet" href="../style.css">
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-bg">

    <div class="login-container">
        <div class="login-header">
            <div class="logo-box">⚙️</div>
            <h1 class="logo-text">תורה האב</h1>
            <h2>ברוכים השבים</h2>
            <p>היכנסו כדי להמשיך את מסע הלמידה שלכם</p>
        </div>

        <div class="login-card">
            <form>
                <div class="input-group">
                    <label>כתובת אימייל</label>
                    <div class="input-wrapper">
                        <input type="email" placeholder="you@example.com">
                        <span class="input-icon">✉️</span>
                    </div>
                </div>

                <div class="input-group">
                    <label>סיסמה</label>
                    <div class="input-wrapper">
                        <input type="password" placeholder="........">
                        <span class="input-icon">🔒</span>
                    </div>
                </div>

                <div class="login-options">
                    <label class="remember-me">
                        <input type="checkbox"> זכור אותי
                    </label>
                    <a href="#" class="forgot-password">שכחתם סיסמה?</a>
                </div>

                <button type="submit" class="btn-login">התחברו</button>
            </form>
        </div>

        <div class="login-footer">
            <span>אין לכם חשבון? <a href="register.html">הירשמו</a></span>
        </div>
    </div>

</body>
</html>
