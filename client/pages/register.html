<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>הרשמה | תורה האב</title>
    <link rel="stylesheet" href="../style.css">
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-bg">

    <div class="login-container">
        <div class="login-header">
            <div class="logo-box">⚙️</div>
            <h1 class="logo-text">תורה האב</h1>
            <h2>צרו את החשבון שלכם</h2>
            <p>הצטרפו לקהילת לימוד התורה שלנו</p>
        </div>

        <div class="login-card">
            <form>
                <div class="input-group">
                    <label>שם מלא</label>
                    <div class="input-wrapper">
                        <input type="text" placeholder="ישראל ישראלי">
                        <span class="input-icon">👤</span>
                    </div>
                </div>

                <div class="input-group">
                    <label>כתובת אימייל</label>
                    <div class="input-wrapper">
                        <input type="email" placeholder="you@example.com">
                        <span class="input-icon">✉️</span>
                    </div>
                </div>

                <div class="input-group">
                    <label>מספר טלפון (אופציונלי)</label>
                    <div class="input-wrapper">
                        <input type="tel" placeholder="050-123-4567">
                        <span class="input-icon">📞</span>
                    </div>
                </div>

                <div class="input-group">
                    <label>סיסמה</label>
                    <div class="input-wrapper">
                        <input type="password" placeholder="........">
                        <span class="input-icon">🔒</span>
                    </div>
                </div>

                <div class="input-group">
                    <label>אימות סיסמה</label>
                    <div class="input-wrapper">
                        <input type="password" placeholder="........">
                        <span class="input-icon">🔒</span>
                    </div>
                </div>

                <button type="submit" class="btn-login" style="margin-top: 10px;">צרו חשבון</button>
            </form>
        </div>

        <div class="login-footer">
            <span>כבר יש לכם חשבון? <a href="login.html">התחברו</a></span>
        </div>
    </div>

</body>
</html>
